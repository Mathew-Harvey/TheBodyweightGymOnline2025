<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | The Bodyweight Gym</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F3F1EC">
    <!-- Self-contained: the service worker shows this page when there is no connection,
         so it cannot rely on the stylesheet or fonts being cached. -->
    <style>
        :root { --paper: #F3F1EC; --ink: #141414; --ink-2: #4A4A48; --rule: rgba(20, 20, 20, .16); }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            background: var(--paper); color: var(--ink);
            font: 400 18px/1.55 'Archivo', 'Helvetica Neue', Arial, sans-serif;
        }
        main { width: 100%; max-width: 1440px; margin: 0 auto; padding: 48px clamp(20px, 4vw, 48px); }
        .label { font: 500 13px/1.45 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
        h1 {
            margin: 20px 0 0; font-size: clamp(56px, 11vw, 150px); line-height: .9; font-weight: 800;
            font-stretch: 75%; text-transform: uppercase; letter-spacing: -.01em;
            border-top: 1px solid var(--rule); padding-top: 24px;
        }
        p.lead { margin: 28px 0 32px; max-width: 26em; font-size: clamp(20px, 2.2vw, 28px); line-height: 1.2; }
        button {
            min-height: 48px; padding: 0 22px; border: 0; border-radius: 0; cursor: pointer;
            background: var(--ink); color: var(--paper);
            font: 600 14px/1 'Archivo', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase;
        }
        button:hover { background: #E87727; color: var(--ink); }
        button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="label">The Bodyweight Gym · Offline</p>
        <h1>No connection.</h1>
        <p class="lead">The classes play from YouTube, so they need the internet. Pages you have opened before may still work.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
