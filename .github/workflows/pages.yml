name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Safety net. While Pages is set to "Deploy from a branch", GitHub also builds the repo root (the README) after every
  # push, and that build finishes after this deploy and replaces the site. Run again once it is done so this deploy is
  # the last one. With Pages set to "GitHub Actions" that build never runs and this trigger does nothing.
  workflow_run:
    workflows: ["pages build and deployment", "pages-build-deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          # Optional repo secret; without it the stored view counts are used.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Prepare the site for the URL it is served from
        # base_path is empty on a custom domain and "/<repo>" on <owner>.github.io/<repo>.
        run: node scripts/prepare-pages.js --out _site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
