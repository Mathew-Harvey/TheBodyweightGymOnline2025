<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - The Bodyweight Gym</title>
    <link rel="stylesheet" href="/css/modern-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a0f1a;
            --dark: #111827;
            --card: #161d2f;
            --primary: #2d8bc9;
            --primary-light: #60a5fa;
            --text: #e2e8f0;
            --sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--navy);
            color: var(--text);
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
        }

        .video-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--navy);
        }

        .header {
            padding: 1rem 2rem;
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(45, 139, 201, 0.2);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-small {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-small img {
            height: 36px;
            width: auto;
        }

        .logo-small span {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
        }

        .back-link {
            color: var(--primary-light);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: rgba(45, 139, 201, 0.1);
            border: 1px solid rgba(45, 139, 201, 0.3);
            transition: all 0.2s;
        }

        .back-link:hover {
            background: rgba(45, 139, 201, 0.2);
            color: var(--primary-light);
        }

        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .video-wrapper {
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(45, 139, 201, 0.2);
        }

        .video-player {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }

        /* Video controls styling */
        .video-player::-webkit-media-controls-panel {
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }

        .video-info {
            margin-top: 2rem;
            max-width: 900px;
            width: 100%;
        }

        .video-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text);
            line-height: 1.3;
        }

        .video-meta {
            color: var(--sub);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .video-meta span {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            background: var(--card);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .video-description {
            color: var(--sub);
            line-height: 1.7;
            font-size: 1rem;
        }
        
        .video-start-info {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(45, 139, 201, 0.15);
            border: 1px solid rgba(45, 139, 201, 0.4);
            border-radius: 8px;
            color: var(--primary-light);
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: var(--sub);
            font-size: 1.1rem;
        }

        .error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: #ef4444;
            text-align: center;
            gap: 1rem;
        }

        .error a {
            color: var(--primary-light);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .header {
                padding: 0.75rem 1rem;
            }
            
            .logo-small span {
                display: none;
            }
            
            .video-container {
                padding: 1rem;
            }
            
            .video-title {
                font-size: 1.25rem;
            }

            .video-meta {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="video-page">
        <header class="header">
            <div class="header-content">
                <a href="/" class="logo-small">
                    <img src="/images/Bwglogo2.png" alt="The Bodyweight Gym">
                    <span>The Bodyweight Gym</span>
                </a>
                <a href="/" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M15 10H5M10 5L5 10L10 15"/>
                    </svg>
                    All Workouts
                </a>
            </div>
        </header>

        <main class="video-container">
            <div class="video-wrapper">
                <video class="video-player" controls preload="metadata" playsinline>
                    <source id="videoSource" src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="video-info" id="videoInfo">
                <div class="loading">Loading video...</div>
            </div>
        </main>
    </div>

    <script src="video-play.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');

        if (!videoId) {
            document.querySelector('.video-wrapper').innerHTML = 
                '<div class="error">No video ID provided.<br><a href="/">Return to workouts</a></div>';
        } else {
            fetch(`/api/videos/${videoId}`)
                .then(response => response.json())
                .then(video => {
                    if (video.error) {
                        throw new Error('Video not found');
                    }
                    
                    const videoElement = document.querySelector('.video-player');
                    const videoSource = document.getElementById('videoSource');
                    videoSource.src = `/api/stream/${videoId}`;
                    videoElement.dataset.videoId = videoId;
                    videoElement.load();
                    
                    // Set the start time if available
                    if (video.startTime && video.startTime > 0) {
                        videoElement.addEventListener('loadedmetadata', function() {
                            videoElement.currentTime = video.startTime;
                        });
                    }
                    
                    document.title = `${video.title} - The Bodyweight Gym`;
                    
                    document.getElementById('videoInfo').innerHTML = `
                        <h1 class="video-title">${video.title}</h1>
                        <div class="video-meta">
                            <span>👤 ${video.instructor}</span>
                            <span>⏱️ ${video.duration}</span>
                            <span>📊 ${video.level}</span>
                            <span>👁️ ${video.views.toLocaleString()} views</span>
                            ${video.startTimeFormatted ? `<span>⏰ Starts at ${video.startTimeFormatted}</span>` : ''}
                        </div>
                        <div class="video-description">${video.description}</div>
                        ${video.startTimeFormatted ? `<div class="video-start-info">⏰ Video starts at ${video.startTimeFormatted} to skip intro</div>` : ''}
                    `;
                    
                    fetch(`/api/videos/${videoId}/view`, { method: 'POST' });
                })
                .catch(error => {
                    console.error('Error loading video:', error);
                    document.querySelector('.video-wrapper').innerHTML = 
                        '<div class="error">Video not found.<br><a href="/">Return to workouts</a></div>';
                    document.getElementById('videoInfo').innerHTML = 
                        '<div class="error">Unable to load video information</div>';
                });
        }
    </script>
</body>
</html>
