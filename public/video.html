<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - The Bodyweight Gym</title>
    <link rel="icon" type="image/png" href="/images/ringLogo.png">
    <link rel="stylesheet" href="/css/modern-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a0f1a;
            --dark: #111827;
            --card: #161d2f;
            --primary: #2d8bc9;
            --primary-light: #60a5fa;
            --text: #e2e8f0;
            --sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--navy);
            color: var(--text);
            font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
        }

        .video-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--navy);
        }

        .header {
            padding: 1rem 2rem;
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(45, 139, 201, 0.2);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-small {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-small img {
            height: 36px;
            width: auto;
        }

        .back-link {
            color: var(--primary-light);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: rgba(45, 139, 201, 0.1);
            border: 1px solid rgba(45, 139, 201, 0.3);
            transition: all 0.2s;
        }

        .back-link:hover {
            background: rgba(45, 139, 201, 0.2);
            color: var(--primary-light);
        }

        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .video-wrapper {
            width: 100%;
            max-width: 900px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(45, 139, 201, 0.2);
        }

        .video-player {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            background: #000;
        }

        .fav-button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid rgba(45, 139, 201, 0.4);
            border-radius: 8px;
            color: var(--primary-light);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .fav-button.active {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.5);
        }

        .video-info {
            margin-top: 2rem;
            max-width: 900px;
            width: 100%;
        }

        .video-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text);
            line-height: 1.3;
        }

        .video-meta {
            color: var(--sub);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .video-meta span {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            background: var(--card);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .video-description {
            color: var(--sub);
            line-height: 1.7;
            font-size: 1rem;
        }
        
        .video-start-info {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(45, 139, 201, 0.15);
            border: 1px solid rgba(45, 139, 201, 0.4);
            border-radius: 8px;
            color: var(--primary-light);
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: var(--sub);
            font-size: 1.1rem;
        }

        .error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: #ef4444;
            text-align: center;
            gap: 1rem;
        }

        .error a {
            color: var(--primary-light);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .header {
                padding: 0.75rem 1rem;
            }
            
            .video-container {
                padding: 1rem;
            }
            
            .video-title {
                font-size: 1.25rem;
            }

            .video-meta {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="video-page">
        <header class="header">
            <div class="header-content">
                <a href="/" class="logo-small">
                    <img src="/images/Bwglogo2.png" alt="The Bodyweight Gym">
                </a>
                <a href="/" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M15 10H5M10 5L5 10L10 15"/>
                    </svg>
                    All Workouts
                </a>
            </div>
        </header>

        <main class="video-container">
            <div class="video-wrapper" id="videoWrapper">
                <div class="loading">Loading video...</div>
            </div>

            <div class="video-info" id="videoInfo">
                <div class="loading">Loading video...</div>
            </div>
        </main>
    </div>

    <script src="/js/data.js"></script>
    <script>
        const esc = BWG.escapeHtml;
        const wrapper = document.getElementById('videoWrapper');
        const videoId = new URLSearchParams(window.location.search).get('id');

        function showError(message) {
            wrapper.innerHTML = `<div class="error">${message}<br><a href="/">Return to workouts</a></div>`;
        }

        function renderFavouriteButton(id) {
            const btn = document.getElementById('favButton');
            const on = BWG.isFavourite(id);
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on);
            btn.textContent = on ? '♥ In your favourites' : '♡ Add to favourites';
        }

        async function loadVideo() {
            if (!videoId) {
                showError('No video ID provided.');
                return;
            }

            let video;
            try {
                const videos = await BWG.getVideos();
                video = videos.find(v => String(v.id) === videoId);
            } catch (error) {
                console.error('Error loading video:', error);
                showError('Unable to load video information.');
                return;
            }
            if (!video) {
                showError('Video not found.');
                return;
            }

            document.title = `${video.title} - The Bodyweight Gym`;

            if (BWG.hasYoutubeId(video)) {
                const params = new URLSearchParams({ rel: '0' });
                if (video.startTime > 0) params.set('start', Math.floor(video.startTime));
                wrapper.innerHTML = `<iframe class="video-player"
                    src="https://www.youtube-nocookie.com/embed/${video.youtubeId}?${params}"
                    title="${esc(video.title)}"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
            } else {
                showError('This workout\'s video is being added. Check back soon!');
            }

            document.getElementById('videoInfo').innerHTML = `
                <h1 class="video-title">${esc(video.title)}</h1>
                <div class="video-meta">
                    <span>👤 ${esc(video.instructor)}</span>
                    <span>⏱️ ${esc(video.duration)}</span>
                    <span>📊 ${esc(video.level)}</span>
                    ${video.startTimeFormatted ? `<span>⏰ Starts at ${esc(video.startTimeFormatted)}</span>` : ''}
                </div>
                <div class="video-description">${esc(video.description)}</div>
                ${video.startTimeFormatted ? `<div class="video-start-info">⏰ Video starts at ${esc(video.startTimeFormatted)} to skip intro</div>` : ''}
                <div><button type="button" class="fav-button" id="favButton"></button></div>
            `;
            renderFavouriteButton(video.id);
            document.getElementById('favButton').addEventListener('click', () => {
                BWG.toggleFavourite(video.id);
                renderFavouriteButton(video.id);
            });
        }

        loadVideo();
    </script>
</body>
</html>
